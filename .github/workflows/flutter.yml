# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Flutter build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clone repository
      uses: actions/checkout@v4
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: zulu
        java-version: 17
        # Cache the Gradle wrapper distribution and dependencies, so builds don't
        # depend on downloading Gradle from GitHub releases every time.
        cache: gradle
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        # Pinned: Flutter 3.50 pins test_api 0.7.14, which needs analyzer >=13,
        # while objectbox_generator 5.x requires analyzer <11, so `pub get`
        # can't resolve. Unpin once objectbox_generator supports analyzer 13+.
        flutter-version: 3.47.x
    - run: flutter pub get
    # dart analyze (unlike flutter analyze) also runs analyzer plugins such as riverpod_lint.
    - name: Analyze
      run: dart analyze
    - run: flutter test
    - run: flutter build apk
    - run: flutter build appbundle
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Releases
        path: |
          build/app/outputs/flutter-apk/app-release.apk
          build/app/outputs/bundle/release/app-release.aab
